name: Ensure API_KEY secret present

on:
  pull_request:
  push:

jobs:
  check-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check API_KEY secret presence
        run: |
          if [ -z "${{ secrets.API_KEY }}" ]; then
            echo "ERROR: secrets.API_KEY is not set. Please add repository secret 'API_KEY'." >&2
            exit 1
          else
            echo "API_KEY secret found."
          fi
